<!DOCTYPE html>
<html>
<head>
    <!-- Force Internet Explorer out of quirks mode into standard compliance rendering -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Classic Table Grid System for maximum compatibility */
        #gridTable {
            margin: 0 auto;
            background-color: #334155;
            border-collapse: separate;
            border-spacing: 2px;
            padding: 6px;
        }
        .cell {
            width: 32px;
            height: 32px;
            background-color: #1e293b;
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .cell-hover {
            background-color: #475569;
        }
        .revealed {
            background-color: #cbd5e1;
            color: #0f172a;
            cursor: default;
        }
        .mine {
            background-color: #ef4444;
            color: #ffffff;
        }
        .flagged {
            background-color: #eab308;
            color: #0f172a;
        }
        /* Number Color Profiles using standard CSS */
        .n1 { color: #2563eb; }
        .n2 { color: #16a34a; }
        .n3 { color: #dc2626; }
        .n4 { color: #7c3aed; }
        
        #status {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            height: 25px;
        }
    </style>
</head>
<body>

    <h1>B.Y.T.E. Minesweeper</h1>
    <p class="subtitle">Optimized Native Compatibility Engine Edition</p>

    <div id="controls">
        <button onclick="resetGame()">Restart Match</button>
    </div>

    <!-- Container for our legacy layout table -->
    <div id="gridContainer"></div>
    <div id="status" style="color: #34d399;"></div>

    <script>
        // Use traditional ES5 variable declarations for old JS interpreters
        var rows = 10;
        var cols = 10;
        var totalMines = 12;
        var board = [];
        var revealedCount = 0;
        var gameOver = false;

        function initBoard() {
            board = [];
            revealedCount = 0;
            gameOver = false;
            document.getElementById('status').innerText = "";
            document.getElementById('status').style.color = "#34d399";
            
            var container = document.getElementById('gridContainer');
            container.innerHTML = "";

            // Create a completely standard HTML Table element instead of modern CSS grids
            var table = document.createElement('table');
            table.id = "gridTable";

            // Generate rows and columns
            for (var r = 0; r < rows; r++) {
                board[r] = [];
                var tr = document.createElement('tr');
                
                for (var c = 0; c < cols; c++) {
                    board[r][c] = {
                        row: r,
                        col: c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0,
                        element: null
                    };

                    var td = document.createElement('td');
                    td.className = 'cell';
                    
                    // Attach click logic safely using classical scope closure loops
                    setupCellEvents(td, r, c);

                    tr.appendChild(td);
                    board[r][c].element = td;
                }
                table.appendChild(tr);
            }
            container.appendChild(table);

            // Plant hidden landmines randomly
            var minesPlanted = 0;
            while (minesPlanted < totalMines) {
                var randR = Math.floor(Math.random() * rows);
                var randC = Math.floor(Math.random() * cols);
                if (!board[randR][randC].isMine) {
                    board[randR][randC].isMine = true;
                    minesPlanted++;
                }
            }

            // Calculate threat proximity indicators
            for (var r = 0; r < rows; r++) {
                for (var c = 0; c < cols; c++) {
                    if (!board[r][c].isMine) {
                        board[r][c].neighborMines = countMinesAround(r, c);
                    }
                }
            }
        }

        // Isolate events to completely prevent legacy browser closure leak bugs
        function setupCellEvents(element, r, c) {
            element.onclick = function() {
                handleLeftClick(r, c);
            };
            
            // Standard right-click catching for classic browsers
            element.oncontextmenu = function(e) {
                if (e && e.preventDefault) {
                    e.preventDefault();
                } else if (window.event) {
                    window.event.returnValue = false; // Old IE alternative syntax
                }
                handleRightClick(r, c);
                return false;
            };

            // Manual hover styling fallback for engines struggling with CSS :hover elements on tables
            element.onmouseover = function() { if(!board[r][c].isRevealed) element.className = 'cell cell-hover'; };
            element.onmouseout = function() { if(!board[r][c].isRevealed) element.className = 'cell'; };
        }

        function countMinesAround(r, c) {
            var count = 0;
            for (var i = -1; i <= 1; i++) {
                for (var j = -1; j <= 1; j++) {
                    if (board[r + i] && board[r + i][c + j] && board[r + i][c + j].isMine) {
                        count++;
                    }
                }
            }
            return count;
        }

        function handleLeftClick(r, c) {
            if (gameOver || board[r][c].isRevealed || board[r][c].isFlagged) return;

            if (board[r][c].isMine) {
                triggerLoss();
                return;
            }

            revealCell(r, c);

            if (revealedCount === (rows * cols) - totalMines) {
                gameOver = true;
                document.getElementById('status').innerText = "VICTORY! Sector Cleared!";
                document.getElementById('status').style.color = "#34d399";
            }
        }

        function handleRightClick(r, c) {
            if (gameOver || board[r][c].isRevealed) return;

            var cell = board[r][c];
            cell.isFlagged = !cell.isFlagged;
            
            if (cell.isFlagged) {
                cell.element.className = 'cell flagged';
                cell.element.innerText = "F"; // Standard letter character replacing unicode flags
            } else {
                cell.element.className = 'cell';
                cell.element.innerText = "";
            }
        }

        function revealCell(r, c) {
            var cell = board[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            revealedCount++;
            cell.element.className = 'cell revealed';

            if (cell.neighborMines > 0) {
                cell.element.innerText = cell.neighborMines;
                cell.element.className = 'cell revealed n' + cell.neighborMines;
            } else {
                for (var i = -1; i <= 1; i++) {
                    for (var j = -1; j <= 1; j++) {
                        if (board[r + i] && board[r + i][c + j]) {
                            revealCell(r + i, c + j);
                        }
                    }
                }
            }
        }

        function triggerLoss() {
            gameOver = true;
            document.getElementById('status').innerText = "BOOM! Game Over.";
            document.getElementById('status').style.color = "#ef4444";

            for (var r = 0; r < rows; r++) {
                for (var c = 0; c < cols; c++) {
                    if (board[r][c].isMine) {
                        board[r][c].element.className = 'cell mine';
                        board[r][c].element.innerText = "X";
                    }
                }
            }
        }

        function resetGame() {
            initBoard();
        }

        // Fire up layout engine on initial load
        initBoard();
    </script>
</body>
</html>
