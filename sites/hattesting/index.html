<!DOCTYPE html>
<html>
<head>
    <title>Hat Language IE Site</title>
    <script>
        if (!String.prototype.trim) {
            String.prototype.trim = function () {
                return this.replace(/^[\s\uFEFF\xA0]+|[\s\uFEFF\xA0]+$/g, '');
            };
        }
    </script>
</head>
<body>

    <div id="hat-output"></div>

    <script type="text/plain">
        <HAT>
            style(backgroundColor, #f4f4f4)
            style(padding, 20px)

            header("IE-Compatible Hat Script")
            
            data(numA = 20)
            data(numB = 30)
            math(result = numA + numB)
            
            show("The calculation outputted:")
            show(result)
        </HAT>
    </script>

    <script crossorigin="anonymous" src="https://worlds194.github.io/Hat/hatengine.js"></script>

</body>
</html>
